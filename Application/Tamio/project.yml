# The Mac app: native macOS, SwiftUI on AppKit. Sparkle (updates) is linked
# and embedded here. Regenerate the project with: xcodegen generate
name: Tamio
options:
  developmentLanguage: en
  knownRegions:
    - Base
    - en
    - zh-Hans
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  TamioModule: { path: ../../Foundation/TamioModule }
  TamioTerminal: { path: ../../Foundation/TamioTerminal }
  MachineStatus: { path: ../../Foundation/MachineStatus }
  MachineStatusView: { path: ../../Foundation/MachineStatusView }
  SymbolPicker: { path: ../../Foundation/SymbolPicker }
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.5"
    # The build number is the version: Sparkle orders updates by it.
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    DEVELOPMENT_TEAM: NCFNX3LJ83
targets:
  Tamio:
    type: application
    platform: macOS
    sources:
      - Application
      - Extension
      - Interface
      - Mac
      - Resources/Localizable.xcstrings
      - path: ../../Resources/EULA
        buildPhase: resources
      - path: ../../Resources/LICENSE
        buildPhase: resources
      - path: ../../Resources/Tamio.icon
        buildPhase: resources
        type: folder.iconcomposer
      # The agents' MCP command and skill (Settings › MCP).
      - path: Helpers/tamio-mcp
        buildPhase: resources
      - path: ../../skills
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_NAME: Tamio
        # Signed to run locally. Workflow/Scripts/build-macos.sh signs release
        # builds with a development certificate when there is one.
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: Tamio
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: macOS/macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: macOS/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleDisplayName: Tamio
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 MOE AI LLC. Based on Rayon: © 2022 Lakr Aream, © 2026 mizorewww and catussh contributors."
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        SWIFT_EMIT_LOC_STRINGS: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../../External/Sparkle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        # The script below fetches Sparkle, outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: sb.moe.tamio.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: sb.moe.tamio
    preBuildScripts:
      - name: Fetch Sparkle
        script: bash "$SRCROOT/../../Workflow/Scripts/sparkle.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: TamioModule
      - package: TamioTerminal
      - package: MachineStatus
      - package: MachineStatusView
      - package: SymbolPicker
      - framework: ../../External/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
schemes:
  Tamio:
    build:
      targets:
        Tamio: all
    run:
      config: Debug
    archive:
      config: Release
